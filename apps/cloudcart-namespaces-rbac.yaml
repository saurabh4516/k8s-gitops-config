apiVersion: v1
kind: Namespace
metadata:
  name: staging
  labels:
    project: cloudcart
    environment: staging
---
apiVersion: v1
kind: Namespace
metadata:
  name: production
  labels:
    project: cloudcart
    environment: production
---
# Staging developer permissions
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloudcart-staging-developer
  namespace: staging
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - configmaps
      - events
    verbs: ["get", "list", "watch"]

  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
    verbs: ["get", "list", "watch", "create", "update", "patch"]

  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloudcart-staging-developers
  namespace: staging
subjects:
  - kind: Group
    name: cloudcart:staging-developers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: cloudcart-staging-developer
  apiGroup: rbac.authorization.k8s.io
---
# Production read-only permissions
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloudcart-production-viewer
  namespace: production
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - configmaps
      - events
    verbs: ["get", "list", "watch"]

  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
    verbs: ["get", "list", "watch"]

  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloudcart-production-viewers
  namespace: production
subjects:
  - kind: Group
    name: cloudcart:production-viewers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: cloudcart-production-viewer
  apiGroup: rbac.authorization.k8s.io
