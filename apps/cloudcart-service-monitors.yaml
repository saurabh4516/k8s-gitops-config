apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cloudcart-customer
  namespace: staging
  labels:
    release: cloudcart-monitoring
spec:
  namespaceSelector:
    matchNames:
      - staging
  selector:
    matchLabels:
      app.kubernetes.io/instance: cloudcart-customer
      app.kubernetes.io/name: customer-service
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
---
