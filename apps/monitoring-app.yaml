apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudcart-monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "92.14.1"
    helm:
      releaseName: cloudcart-monitoring
      values: |
        grafana:
          persistence:
            enabled: false

        prometheus:
          prometheusSpec:
            retention: 3d

        alertmanager:
          alertmanagerSpec:
            secrets:
              - cloudcart-slack-webhook

          config:
            global:
              resolve_timeout: 5m

            inhibit_rules:
              - source_matchers:
                  - 'severity = critical'
                target_matchers:
                  - 'severity =~ warning|info'
                equal:
                  - namespace
                  - alertname
              - source_matchers:
                  - 'severity = warning'
                target_matchers:
                  - 'severity = info'
                equal:
                  - namespace
                  - alertname
              - source_matchers:
                  - 'alertname = InfoInhibitor'
                target_matchers:
                  - 'severity = info'
                equal:
                  - namespace
              - target_matchers:
                  - 'alertname = InfoInhibitor'

            route:
              group_by:
                - namespace
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 12h
              receiver: slack
              routes:
                - receiver: "null"
                  matchers:
                    - 'alertname = "Watchdog"'

            receivers:
              - name: "null"
              - name: slack
                slack_configs:
                  - api_url_file: /etc/alertmanager/secrets/cloudcart-slack-webhook/url
                    channel: '#cloudcart-alerts'
                    send_resolved: true

            templates:
              - '/etc/alertmanager/config/*.tmpl'

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
