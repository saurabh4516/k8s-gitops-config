
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: cloudcart-monitoring
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "92.14.1"

    helm:
      releaseName: cloudcart-monitoring
      values: |
        grafana:
          persistence:
            enabled: false

        prometheus:
          prometheusSpec:
            retention: 3d

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
