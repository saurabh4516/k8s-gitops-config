apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudcart-monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "92.14.1"
    helm:
      releaseName: cloudcart-monitoring
      values: |
        grafana:
          persistence:
            enabled: false

        # Node Exporter is installed on the hosts by Ansible (k8s-ansible-config)
        nodeExporter:
          enabled: false

        prometheus:
          prometheusSpec:
            retention: 3d
            additionalScrapeConfigsSecret:
              enabled: true
              name: node-exporter-scrape-config
              key: additional-scrape-configs.yaml

        alertmanager:
          alertmanagerSpec:
            configSecret: alertmanager-cloudcart-config
            secrets:
              - cloudcart-slack-webhook

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
