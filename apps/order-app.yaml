apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudcart-order
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/saurabh4516/k8s-gitops-platform.git
    targetRevision: main
    path: helm/order-service
    helm:
      releaseName: cloudcart-order
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
