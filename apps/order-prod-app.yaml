apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudcart-order-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/saurabh4516/k8s-gitops-config.git
    targetRevision: main
    path: charts/order-service
    helm:
      releaseName: cloudcart-order-prod
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
