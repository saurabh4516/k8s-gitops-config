apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudcart-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/saurabh4516/k8s-gitops-config.git
    targetRevision: main
    path: apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
